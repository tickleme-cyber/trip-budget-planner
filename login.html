<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripBudget - User Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #0B0F19;
            color: #F8FAFC;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.12) 0px, transparent 50%);
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-badge-pill {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            color: #818CF8;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 10px;
            border-radius: 9999px;
            margin-bottom: 12px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .login-title {
            font-size: 24px;
            font-weight: 800;
            color: #FFFFFF;
            margin: 0 0 6px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-subtitle {
            font-size: 13px;
            color: #94A3B8;
            margin: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #E2E8F0;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: #6366F1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #6366F1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: #4F46E5;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .btn-demo {
            width: 100%;
            padding: 10px;
            background: #334155;
            color: #A5B4FC;
            border: 1px dashed #6366F1;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .btn-demo:hover {
            background: #475569;
            color: #FFFFFF;
        }

        .demo-callout {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            margin-top: 20px;
            font-size: 12px;
            color: #94A3B8;
            line-height: 1.5;
        }

        .toast-msg {
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 14px;
            display: none;
        }
        .toast-success { background: rgba(16, 185, 129, 0.2); color: #34D399; border: 1px solid #10B981; }
        .toast-error { background: rgba(239, 68, 68, 0.2); color: #F87171; border: 1px solid #EF4444; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <span class="brand-badge-pill">OOP College PBL Evaluation</span>
            <h1 class="login-title">✈️ TripBudget Login</h1>
            <p class="login-subtitle">Sign in to access your trip expenses & budget analytics</p>
        </div>

        <div id="loginToast" class="toast-msg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" required value="demo">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required value="demo123">
            </div>

            <div class="form-group">
                <label for="userRole">Role / Profile</label>
                <select id="userRole" class="form-control">
                    <option value="Student / Evaluator">Student / Evaluator</option>
                    <option value="Trip Organizer">Trip Organizer</option>
                    <option value="Traveler">Traveler</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Sign In to Dashboard</button>
            <button type="button" class="btn-demo" id="autoFillBtn">⚡ Auto-Fill Demo User (demo / demo123)</button>
        </form>

        <div class="demo-callout">
            <strong style="color: #818CF8;">🎓 PBL Evaluation Mode:</strong><br>
            • <strong>Demo Credentials:</strong> <code>demo</code> / <code>demo123</code><br>
            • <strong>Java Desktop Version:</strong> Run <code>.\run_java.ps1</code> or <code>run_java.bat</code> for the Java Swing & JDBC application.
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const autoFillBtn = document.getElementById('autoFillBtn');
        const loginToast = document.getElementById('loginToast');

        autoFillBtn.addEventListener('click', () => {
            document.getElementById('username').value = 'demo';
            document.getElementById('password').value = 'demo123';
            showToast('Demo credentials filled! Click "Sign In"', 'success');
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const role = document.getElementById('userRole').value;

            if (!username || !password) {
                showToast('Please enter both username and password', 'error');
                return;
            }

            // Save authenticated session in localStorage/sessionStorage
            localStorage.setItem('tripbudget_user', JSON.stringify({
                username: username,
                role: role,
                isLoggedIn: true,
                loginTime: new Date().toISOString()
            }));

            showToast(`Welcome ${username}! Redirecting to Dashboard...`, 'success');

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 600);
        });

        function showToast(msg, type) {
            loginToast.textContent = msg;
            loginToast.className = `toast-msg toast-${type}`;
            loginToast.style.display = 'block';
        }
    </script>
</body>
</html>
